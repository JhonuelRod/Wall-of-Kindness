<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="15">
    <title>Wall of Kindness</title>
</head>

<body>

<div class="container">

    <div class="board">

        <div class="header top">South Side's</div>

        <img src="/static/images/finalBoard1(2).png" alt="Board">

        <div class="boxes">
            <div class="box red">{{ message1 }}</div>
            <div class="box blue">{{ message2 }}</div>
            <div class="box red">{{ message3 }}</div>
            <div class="box blue">{{ message4 }}</div>
            <div class="box red">{{ message5 }}</div>
            <div class="box blue">{{ message6 }}</div>
        </div>

        <div class="header bottom">Wall of Kindness</div>

    </div>

</div>

</body>

<style>
body {
    margin: 0;
    background-image: url("/static/images/picnicBlanket.jpg");
}

.container {
    text-align: center;
}

.board {
    position: relative;
    width: 100%;
}

.board img {
    width: 100%;
    display: block;
}

.header {
    position: absolute;
    width: 100%;
    text-align: center;
    font-size: 100px;
    font-weight: bold;
    z-index: 2;
    color: black;
}

.top {
    top: 30px;     
}

.bottom {
    bottom: 0px;  
}


.boxes {
    position: absolute;
    top: 22.75%;     
    left: 20%;
    width: 60%;
    height: 55%;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
}

.box {
    background: rgba(255, 235, 161);
    border: 2px solid black;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px;
    box-sizing: border-box;

    font-size: 20px;
    font-weight: bold;
    border-radius: 10px;

    text-align: center;

    white-space: normal;
    overflow-wrap: break-word;
    word-wrap: break-word;
    word-break: break-word;
}
.red { background: #5873F6; }
.blue { background: #C0291B; }

</style>

</html>
